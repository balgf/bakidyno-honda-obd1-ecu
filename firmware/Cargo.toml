[package]
name = "civic-obd1-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "STM32H743VIT6 real-time ECU firmware for Honda Civic OBD1 (Sequential COP + Direct Bosch LSU 4.9)"

[dependencies]
ecu-types = { path = "../crates/ecu-types", default-features = false, features = ["defmt"] }
ecu-core = { path = "../crates/ecu-core", default-features = false, features = ["defmt"] }
proto-native = { path = "../crates/proto-native", default-features = false, features = ["defmt"] }
proto-tunerstudio = { path = "../crates/proto-tunerstudio", default-features = false }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32h743vi",
    "time-driver-tim5",
    "exti",
    "unstable-pac",
    "defmt",
] }
embassy-sync = { version = "0.7", features = ["defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"
embassy-usb = { version = "0.5", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", default-features = false }
heapless = { version = "0.8", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
