[package]
name = "rp2040-dizzy-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RP2040 Pico bench simulator emitting phase-accurate Honda OBD1 24/4/1 (CKP, TDC, CYP) & VSS pulses"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "defmt",
] }

cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
fixed = "1.31"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
