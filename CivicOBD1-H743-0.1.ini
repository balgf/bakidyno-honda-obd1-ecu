;-------------------------------------------------------------------------------
; CivicOBD1-H743-0.1.ini — TunerStudio Definition for Honda OBD1 STM32H743 ECU
; Mirrors crates/proto-tunerstudio Page 1 (2816 bytes) and OutputChannels (24 B)
;-------------------------------------------------------------------------------

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "rusEFI CivicOBD1-H743-0.1"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion     = 3.4

[Constants]
   messageEnvelopeFormat  = msEnvelope_1.0
   endianness             = little
   nPages                 = 1
   blockingFactor         = 128
   delayAfterPortOpen     = 200
   tsWriteBlocks          = on
   pageSize               = 2816
   pageIdentifier         = "\x00\x00"
   pageActivationDelay    = 10
   pageReadCommand        = "R%2i%2o%2c"
   pageValueWrite         = "M%2i%2o%2c%v"
   pageChunkWrite         = "M%2i%2o%2c%v"
   burnCommand            = "B%2i"
   crc32CheckCommand      = "k%2i%2o%2c"
   tableCrcCommand        = "k%2i%2o%2c"

   page = 1
      ; --- Engine & Hardware Scalars (bytes 0..44) ---
      displacementCc    = scalar, U16,    0, "cc",     1,     0,   500,  4000, 0
      injectorFlowCc    = scalar, U16,    2, "cc/min", 1,     0,   100,  2200, 0
      stoichAfr         = scalar, U16,    4, ":1",     0.01,  0,   9.0,  20.0, 2
      revLimitSoft      = scalar, U16,    6, "RPM",    1,     0,  2000, 10000, 0
      revLimitHard      = scalar, U16,    8, "RPM",    1,     0,  2000, 10500, 0
      scsBaseTiming     = scalar, S16,   10, "deg",    0.1,   0, -10.0,  40.0, 1
      triggerOffset     = scalar, S16,   12, "deg",    0.1,   0, -90.0,  90.0, 1
      fanOnEct          = scalar, S16,   14, "C",      1,     0,    40,   130, 0
      fanOffEct         = scalar, S16,   16, "C",      1,     0,    30,   125, 0
      mapKpaAt0V        = scalar, F32,   20, "kPa",    1,     0, -50.0, 100.0, 1
      mapKpaAt5V        = scalar, F32,   24, "kPa",    1,     0,  50.0, 500.0, 1
      vtecEngageRpm     = scalar, U16,   28, "RPM",    1,     0,  2000,  9000, 0
      vtecDisengageRpm  = scalar, U16,   30, "RPM",    1,     0,  1500,  8800, 0
      vtecMinMap        = scalar, U16,   32, "kPa",    1,     0,     0,   300, 0
      vtecMinTps        = scalar, U08,   34, "%",      1,     0,     0,   100, 0
      vtecMinVss        = scalar, U08,   35, "km/h",   1,     0,     0,   250, 0
      vtecMinEct        = scalar, S16,   36, "C",      1,     0,   -20,   130, 0
      vtecRequireVtp    = bits,   U08,   38, [0:0], "Bypass (JDM)", "Require VTP Switch"
      vtecVtpTimeoutMs  = scalar, U16,   40, "ms",     1,     0,    50,  5000, 0

      ; --- Shared 16x16 Table Axes (bytes 44..108) ---
      rpmBins           = array,  U16,   44, [16],    "RPM",    1,     0,   300, 10500, 0
      mapBins           = array,  U16,   76, [16],    "kPa",    1,     0,     5,   350, 0

      ; --- 2D Tables [map_idx][rpm_idx] (bytes 108..2668) ---
      veLowTable        = array,  U16,  108, [16x16], "%",      0.1,   0,     0,   250, 1
      veVtecTable       = array,  U16,  620, [16x16], "%",      0.1,   0,     0,   250, 1
      sparkLowTable     = array,  S16, 1132, [16x16], "deg",    0.1,   0,   -15,    60, 1
      sparkVtecTable    = array,  S16, 1644, [16x16], "deg",    0.1,   0,   -15,    60, 1
      targetLambdaTable = array,  U16, 2156, [16x16], "lambda", 0.001, 0,   0.5,   1.5, 3

      ; --- 1D Battery & Coolant Curves (bytes 2668..2796) ---
      vbattBins         = array,  U16, 2668, [8],     "V",      0.1,   0,   6.0,  20.0, 1
      injDeadtimeUs     = array,  U16, 2684, [8],     "us",     1,     0,     0,  5000, 0
      copDwellUs        = array,  U16, 2700, [8],     "us",     1,     0,   500, 10000, 0
      ectBins           = array,  S16, 2716, [8],     "C",      1,     0,   -40,   150, 0
      warmupPct         = array,  U16, 2732, [8],     "%",      1,     0,    50,   300, 0
      crankingPwUs      = array,  U32, 2748, [8],     "us",     1,     0,     0, 100000, 0
      iacvBaseDuty      = array,  U16, 2780, [8],     "%",      0.1,   0,     0,   100, 1

[Menu]
   menuDialog = main
   menu = "&Engine Setup"
      subMenu = engineSettings,   "Engine & &Injector Constants"
      subMenu = triggerSettings,  "&Trigger & Rev Limits"
      subMenu = vtecSettings,     "&VTEC Engagement"
      subMenu = mapCalSettings,   "&MAP Sensor Calibration"
      subMenu = fanSettings,      "Radiator &Fan Control"
   menu = "&Fuel & Spark"
      subMenu = veLowTbl,         "VE Table - &Low Cam"
      subMenu = veVtecTbl,        "VE Table - &VTEC High Cam"
      subMenu = sparkLowTbl,      "Ignition Advance - L&ow Cam"
      subMenu = sparkVtecTbl,     "Ignition Advance - V&TEC Cam"
      subMenu = targetLambdaTbl,  "Target &Lambda Table"
   menu = "&Corrections"
      subMenu = injDeadtimeCurve, "Injector &Deadtime vs Battery"
      subMenu = copDwellCurve,    "Smart COP &Dwell vs Battery"
      subMenu = warmupCurve,      "&Warmup Enrichment vs Coolant"
      subMenu = crankingCurve,    "&Cranking Prime PW vs Coolant"
      subMenu = iacvCurve,        "&IACV Base Duty vs Coolant"

[UserDefined]
   dialog = engineSettings, "Engine & Injector Constants"
      field = "Engine Displacement",       displacementCc
      field = "Injector Flow Rate",        injectorFlowCc
      field = "Stoichiometric AFR",        stoichAfr

   dialog = triggerSettings, "Trigger & Rev Limits"
      field = "Soft Cut Rev Limit",        revLimitSoft
      field = "Hard Fuel/Spark Cut Limit", revLimitHard
      field = "SCS Base Alignment Timing", scsBaseTiming
      field = "Distributor Trigger Offset", triggerOffset

   dialog = vtecSettings, "VTEC Engagement Conditions"
      field = "Engage RPM",                vtecEngageRpm
      field = "Disengage RPM",             vtecDisengageRpm
      field = "Minimum MAP",               vtecMinMap
      field = "Minimum TPS",               vtecMinTps
      field = "Minimum Vehicle Speed",     vtecMinVss
      field = "Minimum Coolant Temp",      vtecMinEct
      field = "VTP Pressure Switch Mode",  vtecRequireVtp
      field = "VTP Confirm Timeout",       vtecVtpTimeoutMs

   dialog = mapCalSettings, "MAP Sensor Linear Calibration"
      field = "Pressure at 0.00V",         mapKpaAt0V
      field = "Pressure at 5.00V",         mapKpaAt5V

   dialog = fanSettings, "Radiator Fan Hysteresis"
      field = "Fan ON Temp",               fanOnEct
      field = "Fan OFF Temp",              fanOffEct

[TableEditor]
   table = veLowTbl, veLowMap, "VE Table (Low Cam) %", 1
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = veLowTable
      upDownLabel = "RICHER", "LEANER"
      gridOrient  = 250, 0, 340

   table = veVtecTbl, veVtecMap, "VE Table (VTEC High Cam) %", 1
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = veVtecTable
      upDownLabel = "RICHER", "LEANER"
      gridOrient  = 250, 0, 340

   table = sparkLowTbl, sparkLowMap, "Ignition Advance (Low Cam) deg BTDC", 1
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = sparkLowTable
      upDownLabel = "MORE ADV", "LESS ADV"
      gridOrient  = 250, 0, 340

   table = sparkVtecTbl, sparkVtecMap, "Ignition Advance (VTEC High Cam) deg BTDC", 1
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = sparkVtecTable
      upDownLabel = "MORE ADV", "LESS ADV"
      gridOrient  = 250, 0, 340

   table = targetLambdaTbl, targetLambdaMap, "Target Lambda", 1
      xBins       = rpmBins, rpm
      yBins       = mapBins, map
      zBins       = targetLambdaTable
      upDownLabel = "LEANER", "RICHER"
      gridOrient  = 250, 0, 340

[CurveEditor]
   curve = injDeadtimeCurve, "Injector Deadtime vs Battery Voltage"
      columnLabel = "Voltage (V)", "Deadtime (us)"
      xAxis       = 8, 16, 9
      yAxis       = 0, 2500, 6
      xBins       = vbattBins, batteryVoltage
      yBins       = injDeadtimeUs

   curve = copDwellCurve, "Smart COP Dwell vs Battery Voltage"
      columnLabel = "Voltage (V)", "Dwell (us)"
      xAxis       = 8, 16, 9
      yAxis       = 1000, 6000, 6
      xBins       = vbattBins, batteryVoltage
      yBins       = copDwellUs

   curve = warmupCurve, "Warmup Enrichment vs Coolant Temp"
      columnLabel = "Coolant (C)", "Enrichment (%)"
      xAxis       = -20, 120, 8
      yAxis       = 80, 200, 7
      xBins       = ectBins, coolant
      yBins       = warmupPct

   curve = crankingCurve, "Cranking Prime Pulse Width vs Coolant Temp"
      columnLabel = "Coolant (C)", "Prime PW (us)"
      xAxis       = -20, 120, 8
      yAxis       = 0, 25000, 6
      xBins       = ectBins, coolant
      yBins       = crankingPwUs

   curve = iacvCurve, "IACV Base Duty vs Coolant Temp"
      columnLabel = "Coolant (C)", "Duty (%)"
      xAxis       = -20, 120, 8
      yAxis       = 0, 100, 6
      xBins       = ectBins, coolant
      yBins       = iacvBaseDuty

[OutputChannels]
   deadValue        = { 0 }
   ochBlockSize     = 24
   ochGetCommand    = "O%2o%2c"
   secl             = scalar, U16,  0, "s",      1,     0.0
   rpm              = scalar, U16,  2, "RPM",    1,     0.0
   map              = scalar, U16,  4, "kPa",    0.1,   0.0
   coolant          = scalar, S16,  6, "C",      0.1,   0.0
   mat              = scalar, S16,  8, "C",      0.1,   0.0
   tps              = scalar, U16, 10, "%",      0.1,   0.0
   batteryVoltage   = scalar, U16, 12, "V",      0.1,   0.0
   lambda1          = scalar, U16, 14, "lambda", 0.001, 0.0
   pulseWidth1      = scalar, U16, 16, "ms",     0.01,  0.0
   advance          = scalar, S16, 18, "deg",    0.1,   0.0
   veCurr1          = scalar, U16, 20, "%",      0.1,   0.0
   statusBits       = scalar, U16, 22, "bits",   1,     0.0

   afr1             = { lambda1 * 14.7 }
   syncBits         = { statusBits & 3 }
   vtecBits         = { (statusBits >> 2) & 3 }
   fullSync         = { syncBits == 2 }
   vtecActive       = { vtecBits == 2 }
   fuelPumpOn       = { (statusBits & 16) != 0 }
   fanOn            = { (statusBits & 32) != 0 }

[GaugeConfigurations]
   gaugeCategory = "Civic OBD1 Engine"
      rpmGauge     = rpm,            "Engine Speed",     "RPM",    0,  9000,   300,   600,  7800,  8400, 0, 0
      mapGauge     = map,            "Manifold Abs P",   "kPa",    0,   140,    15,    20,   100,   115, 1, 1
      ectGauge     = coolant,        "Coolant Temp",     "C",    -20,   120,     0,    40,   100,   110, 1, 1
      iatGauge     = mat,            "Intake Air Temp",  "C",    -20,   100,     0,    10,    60,    80, 1, 1
      tpsGauge     = tps,            "Throttle Pos",     "%",      0,   100,     0,     1,    90,   100, 1, 1
      battGauge    = batteryVoltage, "Battery Voltage",  "V",      8,    16,  11.5,  12.0,  14.8,  15.5, 1, 1
      lambdaGauge  = lambda1,        "Lambda",           "lam", 0.65,  1.25,  0.75,  0.80,  1.10,  1.20, 3, 2
      afrGauge     = afr1,           "Air-Fuel Ratio",   ":1",  10.0,  18.0,  11.0,  12.0,  16.0,  17.0, 1, 1
      pwGauge      = pulseWidth1,    "Injector PW 1",    "ms",     0,    25,     0,   1.0,  18.0,  22.0, 2, 1
      advGauge     = advance,        "Ignition Advance", "deg",  -10,    50,    -5,     0,    38,    45, 1, 1
      veGauge      = veCurr1,        "Current VE",       "%",      0,   130,     0,    20,   105,   120, 1, 1

[FrontPage]
   gauge1 = rpmGauge
   gauge2 = mapGauge
   gauge3 = lambdaGauge
   gauge4 = advGauge
   gauge5 = pwGauge
   gauge6 = ectGauge
   gauge7 = veGauge
   gauge8 = battGauge

   indicator = { fullSync },   "Not Synced",   "720 Full Sync", white, black, green, black
   indicator = { vtecActive }, "Low Cam",      "VTEC Active",   white, black, green, black
   indicator = { fuelPumpOn }, "Pump Off",     "Fuel Pump ON",  white, black, green, black
   indicator = { fanOn },      "Fan Off",      "Rad Fan ON",    white, black, red,   black

[Datalog]
   entry = secl,           "Time",       int,   "%d"
   entry = rpm,            "RPM",        int,   "%d"
   entry = map,            "MAP",        float, "%.1f"
   entry = coolant,        "ECT",        float, "%.1f"
   entry = mat,            "IAT",        float, "%.1f"
   entry = tps,            "TPS",        float, "%.1f"
   entry = batteryVoltage, "VBatt",      float, "%.1f"
   entry = lambda1,        "Lambda",     float, "%.3f"
   entry = afr1,           "AFR",        float, "%.2f"
   entry = pulseWidth1,    "PW1",        float, "%.2f"
   entry = advance,        "SparkAdv",   float, "%.1f"
   entry = veCurr1,        "VE",         float, "%.1f"
   entry = statusBits,     "Status",     int,   "%d"
